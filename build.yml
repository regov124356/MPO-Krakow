name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p /tmp/w
            echo 'rootProject.name = "w"' > /tmp/w/settings.gradle.kts
            gradle -p /tmp/w wrapper --gradle-version 8.14.3 --distribution-type bin 2>&1 | tee wrapper.log
            cp -r /tmp/w/gradlew /tmp/w/gradlew.bat /tmp/w/gradle .
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper
            git commit -m "Add Gradle wrapper"
            git push || true
          fi
          chmod +x gradlew

      - name: Build and unit tests
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Live MPO API check
        id: live
        continue-on-error: true
        env:
          LIVE_API: "1"
          TEST_STREET: ${{ vars.TEST_STREET || 'Romanowicza' }}
          TEST_NUMBER: ${{ vars.TEST_NUMBER || '1 DM' }}
        run: ./gradlew --no-daemon cleanTestDebugUnitTest testDebugUnitTest --tests 'pl.necek.wywoz.LiveApiTest' 2>&1 | tee live.log

      - uses: actions/upload-artifact@v4
        with:
          name: wywoz-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk wywoz.apk
          {
            echo "Build $GITHUB_SHA"
            echo
            echo "Live MPO API check: ${{ steps.live.outcome }}"
            echo
            echo '```'
            tail -c 60000 live.log
            echo '```'
          } > notes.md
          gh release delete build-log --yes --cleanup-tag || true
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk wywoz.apk --title "Wywóz śmieci" --notes-file notes.md --target "$GITHUB_SHA"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build failed: $GITHUB_SHA"
            echo
            echo '```'
            for f in wrapper.log build.log; do
              if [ -f "$f" ]; then tail -c 30000 "$f"; fi
            done
            echo '```'
          } > fail.md
          gh release delete build-log --yes --cleanup-tag || true
          gh release create build-log --prerelease --title "Build log" --notes-file fail.md --target "$GITHUB_SHA"
